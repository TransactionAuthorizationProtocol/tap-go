name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap-go
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout go-didcomm
        uses: actions/checkout@v4
        with:
          repository: Notabene-id/go-didcomm
          path: ../go-didcomm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap-go
        uses: actions/checkout@v4

      - name: Checkout go-didcomm
        uses: actions/checkout@v4
        with:
          repository: Notabene-id/go-didcomm
          path: ../go-didcomm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
