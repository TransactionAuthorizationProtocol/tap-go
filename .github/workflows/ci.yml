name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap-go
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone go-didcomm
        run: git clone --depth 1 https://github.com/Notabene-id/go-didcomm.git ../go-didcomm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap-go
        uses: actions/checkout@v4

      - name: Clone go-didcomm
        run: git clone --depth 1 https://github.com/Notabene-id/go-didcomm.git ../go-didcomm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap-go
        uses: actions/checkout@v4

      - name: Clone go-didcomm
        run: git clone --depth 1 https://github.com/Notabene-id/go-didcomm.git ../go-didcomm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
